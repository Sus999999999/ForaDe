name: forade
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  http: ^1.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/foradeIcon.png"
  web:
    generate: true
    image_path: "assets/images/foradeIcon.png"
  windows:
    generate: true
    image_path: "assets/images/foradeIcon.png"
    icon_size: 48

